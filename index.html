// Progressive overload suggestion
function suggestNextWeight(lastSet, target) {
  if (!lastSet) return { weight: 0, reps: target, reason: 'Ny øvelse' };
  const lastKg = parseFloat(lastSet.kg) || 0;
  const lastReps = parseInt(lastSet.reps) || 0;
  const lastRPE = lastSet.rpe;
  if (lastReps >= target && (!lastRPE || lastRPE <= 8)) {
    return { weight: lastKg + 2.5, reps: target, reason: '+2.5kg progression' };
  }
  if (lastReps < target) {
    return { weight: lastKg, reps: target, reason: 'Samme vægt - hit target reps' };
  }
  return { weight: lastKg, reps: target, reason: 'Samme vægt - byg op' };
}

// ─── PERSISTENCE: multi-backend for max device compatibility ──────
// Priority: localStorage (works on iOS + future PWA) → window.storage → memory
const memCache = new Map();
let storageWorking = null;
let storageError = '';
let storageBackend = 'unknown'; // 'local' | 'window' | 'memory'
const LS_PREFIX = 'complete:';

function hasLocalStorage() {
  try {
    const k = '__ls_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
}

const probeStorage = async () => {
  // 1. localStorage — most portable, survives reload on iOS + works in PWA
  if (hasLocalStorage()) {
    storageWorking = true;
    storageBackend = 'local';
    return;
  }
  // 2. window.storage (Claude artifact API)
  if (window.storage) {
    try {
      const testKey = '__probe__';
      const testVal = JSON.stringify({ t: Date.now() });
      await window.storage.set(testKey, testVal);
      const back = await window.storage.get(testKey);
      if (back && back.value === testVal) {
        try { await window.storage.delete(testKey); } catch {}
        storageWorking = true;
        storageBackend = 'window';
        return;
      }
      throw new Error('roundtrip mismatch');
    } catch (e) {
      storageError = e?.message || String(e);
    }
  }
  // 3. memory only
  storageWorking = false;
  storageBackend = 'memory';
};

const safeGet = async (key) => {
  // localStorage first
  if (hasLocalStorage()) {
    try {
      const v = window.localStorage.getItem(LS_PREFIX + key);
      if (v !== null) {
        memCache.set(key, v);
        storageWorking = true;
        storageBackend = 'local';
        return v;
      }
    } catch (e) {}
  }
  // window.storage fallback
  if (window.storage && storageBackend !== 'local') {
    try {
      const res = await window.storage.get(key);
      if (res && typeof res === 'object' && 'value' in res && res.value) {
        memCache.set(key, res.value);
        storageWorking = true;
        return res.value;
      }
    } catch (e) {}
  }
  return memCache.get(key) || null;
};

const safeSet = async (key, value) => {
  memCache.set(key, value);
  let ok = false;
  // localStorage primary
  if (hasLocalStorage()) {
    try {
      window.localStorage.setItem(LS_PREFIX + key, value);
      ok = true;
      storageBackend = 'local';
    } catch (e) {
      storageError = e?.message || String(e);
    }
  }
  // window.storage as secondary (only if localStorage unavailable)
  if (!ok && window.storage) {
    try {
      await window.storage.set(key, value);
      ok = true;
      storageBackend = 'window';
    } catch (e) {
      storageError = e?.message || String(e);
    }
  }
  if (ok) { storageWorking = true; storageError = ''; return { ok: true }; }
  storageWorking = false;
  storageBackend = 'memory';
  return { ok: false, reason: storageError || 'alle backends fejlede' };
};

const safeList = async (prefix) => {
  const keys = new Set();
  // localStorage
  if (hasLocalStorage()) {
    try {
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.startsWith(LS_PREFIX + prefix)) {
          keys.add(k.slice(LS_PREFIX.length));
        }
      }
    } catch (e) {}
  }
  // window.storage
  if (window.storage && storageBackend !== 'local') {
    try {
      const res = await window.storage.list(prefix);
      if (res && res.keys && Array.isArray(res.keys)) res.keys.forEach(k => keys.add(k));
    } catch (e) {}
  }
  // memcache
  Array.from(memCache.keys()).filter(k => k.startsWith(prefix)).forEach(k => keys.add(k));
  return Array.from(keys);
};

const safeDelete = async (key) => {
  memCache.delete(key);
  if (hasLocalStorage()) {
    try { window.localStorage.removeItem(LS_PREFIX + key); } catch (e) {}
  }
  if (window.storage) {
    try { await window.storage.delete(key); } catch (e) {}
  }
};

// Calculate total macros from foods array
const calcTotals = (foods) => {
  if (!foods || foods.length === 0) return { protein: 0, carbs: 0, fat: 0 };
  return foods.reduce((acc, f) => ({
    protein: acc.protein + (f.p * f.qty),
    carbs: acc.carbs + (f.c * f.qty),
    fat: acc.fat + (f.f * f.qty),
  }), { protein: 0, carbs: 0, fat: 0 });
};

// Calculate sleep hours from bedtime/waketime strings (HH:MM)
function calcSleepHours(bedtime, waketime) {
  if (!bedtime || !waketime) return 0;
  const [bh, bm] = bedtime.split(':').map(Number);
  const [wh, wm] = waketime.split(':').map(Number);
  if (isNaN(bh) || isNaN(wh)) return 0;
  let bedMin = bh * 60 + bm;
  let wakeMin = wh * 60 + wm;
  if (wakeMin <= bedMin) wakeMin += 24 * 60; // crossed midnight
  return (wakeMin - bedMin) / 60;
}

// COMPLETE Score — daily performance 0-100
function computeScore(entry) {
  const empty = { total: 0, sleep: 0, protein: 0, training: 0, hydration: 0,
    proteinGrams: 0, waterUnits: 0, suppCount: 0, sleepHours: 0, sleepQuality: 0, trained: false };
  if (!entry) return empty;

  // SLEEP (25): blend hours (target 8h) and quality (0-10)
  const quality = entry.sleep?.quality || 0;
  const hours = calcSleepHours(entry.sleep?.bedtime, entry.sleep?.waketime);
  let sleepScore = 0;
  if (quality > 0 && hours > 0) {
    sleepScore = Math.min(hours / 8, 1) * 12.5 + (quality / 10) * 12.5;
  } else if (quality > 0) {
    sleepScore = (quality / 10) * 25;
  } else if (hours > 0) {
    sleepScore = Math.min(hours / 8, 1) * 25;
  }

  // PROTEIN (25)
  const protein = calcTotals(entry.macros?.foods).protein || entry.macros?.protein || 0;
  const proteinScore = Math.min(protein / GOALS.protein, 1) * 25;

  // TRAINING (25)
  const trained = entry.workout?.exercises &&
    Object.values(entry.workout.exercises).some(sets =>
      Array.isArray(sets) && sets.some(s => s && s.kg && s.reps));
  let trainingScore = 0;
  if (trained) trainingScore = 25;
  else if (entry.workoutType === 'rest') trainingScore = 25; // rest is valid

  // HYDRATION + SUPPLEMENTS (25)
  const waterScore = Math.min((entry.water || 0) / GOALS.water, 1) * 12.5;
  const suppCount = Object.values(entry.supplements || {}).filter(Boolean).length;
  const suppScore = Math.min(suppCount / 4, 1) * 12.5;
  const hydrationScore = waterScore + suppScore;

  return {
    total: Math.round(sleepScore + proteinScore + trainingScore + hydrationScore),
    sleep: Math.round(sleepScore),
    protein: Math.round(proteinScore),
    training: Math.round(trainingScore),
    hydration: Math.round(hydrationScore),
    proteinGrams: Math.round(protein),
    waterUnits: entry.water || 0,
    suppCount,
    sleepHours: hours,
    sleepQuality: quality,
    trained: !!trained,
  };
}

function App() {
  const [screen, setScreen] = useState('home'); // 'home' | 'tracker'
  const [screenDirection, setScreenDirection] = useState('forward'); // forward | back | fade
  const [tab, setTab] = useState('today');
  const [date, setDate] = useState(todayKey());
  const [entry, setEntry] = useState(emptyEntry());
  const [history, setHistory] = useState({});
  const [loading, setLoading] = useState(true);
  const [foodCatalog, setFoodCatalog] = useState([]); // user's custom foods + usage stats

  const [saveStatus, setSaveStatus] = useState('idle'); // idle | saving | saved | error
  const [storageMode, setStorageMode] = useState('checking'); // checking | persistent | memory
  const [errorDetail, setErrorDetail] = useState('');

  // Load food catalog (custom foods + usage stats) once
  useEffect(() => {
    (async () => {
      await probeStorage();
      setStorageMode(storageWorking ? 'persistent' : 'memory');
      if (!storageWorking) setErrorDetail(storageError);
      const val = await safeGet('foods:catalog');
      if (val) {
        try { setFoodCatalog(JSON.parse(val)); } catch {}
      }
    })();
  }, []);

  const updateCatalog = async (newCatalog) => {
    setFoodCatalog(newCatalog);
    await safeSet('foods:catalog', JSON.stringify(newCatalog));
  };

  // Load entry for current date
  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    (async () => {
      let loaded = emptyEntry();
      const val = await safeGet(`entry:${date}`);
      if (val) {
        try {
          const parsed = JSON.parse(val);
          loaded = { ...emptyEntry(), ...parsed };
        } catch (e) {
          // Corrupt data, use empty
        }
      }
      if (!cancelled) {
        setEntry(loaded);
        setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [date]);

  // Auto-save when entry changes (debounced to prevent race conditions)
  useEffect(() => {
    if (loading) return;
    setSaveStatus('saving');
    const timeoutId = setTimeout(async () => {
      const result = await safeSet(`entry:${date}`, JSON.stringify(entry));
      if (result.ok) {
        setSaveStatus('saved');
        setStorageMode('persistent');
        setErrorDetail('');
        setTimeout(() => setSaveStatus('idle'), 1200);
      } else {
        setSaveStatus('error');
        setStorageMode('memory');
        setErrorDetail(result.reason || 'unknown');
      }
    }, 500);
    return () => clearTimeout(timeoutId);
  }, [entry, date, loading]);

  // Load history of all exercises
  const reloadHistory = async () => {
    try {
      const keys = await safeList('entry:');
      const newHistory = {};
      if (keys.length > 0) {
        const entries = await Promise.all(
          keys.map(async (k) => {
            const v = await safeGet(k);
            if (!v) return null;
            try { return { key: k, data: JSON.parse(v) }; } catch { return null; }
          })
        );
        entries.forEach((e) => {
          if (!e || !e.data.workout || !e.data.workout.exercises) return;
          const dateKey = e.key.replace('entry:', '');
          Object.entries(e.data.workout.exercises).forEach(([exId, sets]) => {
            const completed = sets.filter(s => s && s.kg && s.reps);
            if (completed.length === 0) return;
            const top = completed.reduce((a, b) =>
              parseFloat(a.kg) >= parseFloat(b.kg) ? a : b
            );
            if (!newHistory[exId]) newHistory[exId] = [];
            newHistory[exId].push({ date: dateKey, kg: parseFloat(top.kg), reps: parseInt(top.reps) });
          });
        });
        Object.keys(newHistory).forEach(k => {
          newHistory[k].sort((a, b) => b.date.localeCompare(a.date));
        });
      }
      setHistory(newHistory);
    } catch (e) {
      console.error('History load failed', e);
    }
  };

  useEffect(() => {
    if (!loading) reloadHistory();
  }, [date, loading, saveStatus === 'saved']);

  // Race-condition-free update using functional setState
  const update = (path, value) => {
    setEntry(prev => {
      const newEntry = JSON.parse(JSON.stringify(prev));
      const keys = path.split('.');
      let obj = newEntry;
      for (let i = 0; i < keys.length - 1; i++) {
        if (!obj[keys[i]]) obj[keys[i]] = {};
        obj = obj[keys[i]];
      }
      obj[keys[keys.length - 1]] = value;
      return newEntry;
    });
  };

  // ─── ACTIVE SESSION ────────────────────────────────────────────
  const [activeSession, setActiveSession] = useState(null);

  // Restore active session on load
  useEffect(() => {
    (async () => {
      const val = await safeGet('active:session');
      if (val) {
        try { setActiveSession(JSON.parse(val)); } catch {}
      }
    })();
  }, []);

  // Persist active session
  useEffect(() => {
    if (activeSession) {
      safeSet('active:session', JSON.stringify(activeSession));
    } else {
      safeSet('active:session', '');
    }
  }, [activeSession]);

  const startSession = (workoutType) => {
    const prog = PROGRAM[workoutType];
    if (!prog) return;
    setActiveSession({
      startTime: Date.now(),
      workoutType,
      currentExerciseId: prog.exercises[0].id,
      currentSetIndex: 0,
      phase: 'logging',
      pendingSet: null,
      restEndTime: null,
      restPlannedDuration: 0,
      completedSets: [],
    });
    setScreenDirection('forward');
    setScreen('tracker');
    update('workoutType', workoutType);
  };

  const completeSession = async () => {
    setActiveSession(null);
    // Force-reload history so stats reflect the just-completed session
    await reloadHistory();
    // Auto-navigate to stats tab so user immediately sees their data
    setTab('stats');
  };

  // Screen navigation with direction-aware animations
  const goToTracker = () => {
    setScreenDirection('forward');
    setScreen('tracker');
  };
  const goToHome = () => {
    setScreenDirection('back');
    setDate(todayKey()); // home always reflects today
    setScreen('home');
  };

  // ─── PEAK SCORE (weekly avg + streak from storage) ──────────
  const [scoreData, setScoreData] = useState({ weekAvg: 0, streak: 0, todayTotal: null });

  const computeScoreData = async () => {
    const todayK = todayKey();
    const scores = [];
    let streak = 0;
    let streakBroken = false;
    let todayTotal = null;
    for (let i = 0; i < 7; i++) {
      const d = shiftDate(todayK, -i);
      const val = await safeGet(`entry:${d}`);
      let s = null;
      if (val) {
        try { s = computeScore(JSON.parse(val)); } catch {}
      }
      if (i === 0) todayTotal = s ? s.total : 0;
      if (s) scores.push(s.total);
      if (!streakBroken) {
        if (s && s.total >= 70) streak++;
        else streakBroken = true;
      }
    }
    const weekAvg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
    setScoreData({ weekAvg, streak, todayTotal });
  };

  useEffect(() => {
    if (!loading) computeScoreData();
  }, [loading, saveStatus === 'saved', screen]);
  // ────────────────────────────────────────────────────────────────
  // ────────────────────────────────────────────────────────────────

  return (
    <div
      className="body"
      style={{
        background: COLORS.bg,
        color: COLORS.text,
        minHeight: '100vh',
        maxWidth: 480,
        margin: '0 auto',
        position: 'relative',
        paddingBottom: screen === 'tracker' ? 'calc(80px + env(safe-area-inset-bottom))' : 'env(safe-area-inset-bottom)',
        paddingTop: 'env(safe-area-inset-top)',
      }}
    >
      <style>{styles}</style>
      {screen === 'home' ? (
        <div
          key="home"
          className={screenDirection === 'back' ? 'screen-back' : 'screen-fade'}
        >
          <HomeScreen
            onEnter={goToTracker}
            history={history}
            entry={entry}
            activeSession={activeSession}
            scoreData={scoreData}
          />
        </div>
      ) : activeSession ? (
        <div key="active" className="screen-forward">
          <ActiveSession
            session={activeSession}
            setSession={setActiveSession}
            entry={entry}
            update={update}
            history={history}
            onEnd={completeSession}
            onHome={goToHome}
          />
        </div>
      ) : (
        <>
          <div key="tracker" className={screenDirection === 'forward' ? 'screen-forward' : 'screen-fade'}>
            <Header date={date} setDate={setDate} saveStatus={saveStatus} onHome={goToHome} />
            {storageMode === 'memory' && (
              <div style={{
                background: '#7A1D1D',
                color: '#FFD7D7',
                padding: '10px 16px',
                fontSize: 12,
                textAlign: 'center',
                lineHeight: 1.4,
              }}>
                ⚠️ Persistent storage virker ikke ({errorDetail || 'ukendt'}). Data gemmes kun i denne session.
              </div>
            )}
            <div style={{ padding: '0 16px' }}>
              {loading ? (
                <div style={{ padding: 60, textAlign: 'center', color: COLORS.textDim }}>...</div>
              ) : (
                <>
                  {tab === 'today' && <TodayTab entry={entry} update={update} history={history} foodCatalog={foodCatalog} updateCatalog={updateCatalog} onStartSession={startSession} date={date} />}
                  {tab === 'program' && <ProgramTab />}
                  {tab === 'stats' && <StatsTab history={history} />}
                </>
              )}
            </div>
          </div>
          <BottomNav tab={tab} setTab={setTab} />
        </>
      )}
    </div>
  );
}

function ScoreRing({ score, weekAvg, streak, onTap }) {
  const size = 200;
  const stroke = 14;
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const color = scoreColor(score);
  const offset = circumference * (1 - score / 100);

  const label = score < 40 ? 'BAGUD' : score < 70 ? 'PÅ SPORET' : 'EXCELLENCE';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <button
        onClick={onTap}
        style={{
          background: 'transparent',
          border: 'none',
          cursor: 'pointer',
          position: 'relative',
          width: size,
          height: size,
          padding: 0,
        }}
      >
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
          <circle cx={size/2} cy={size/2} r={radius} stroke={COLORS.surfaceLight} strokeWidth={stroke} fill="none" />
          <circle
            cx={size/2}
            cy={size/2}
            r={radius}
            stroke={color}
            strokeWidth={stroke}
            fill="none"
            strokeDasharray={circumference}
            strokeDashoffset={offset}
            strokeLinecap="round"
            style={{ transition: 'stroke-dashoffset 0.8s cubic-bezier(0.22,1,0.36,1), stroke 0.4s' }}
          />
        </svg>
        <div style={{
          position: 'absolute',
          inset: 0,
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
        }}>
          <div className="mono" style={{ fontSize: 9, letterSpacing: '0.3em', color: COLORS.textDim, marginBottom: 2 }}>
            PEAK SCORE
          </div>
          <div className="display" style={{ fontSize: 64, lineHeight: 0.9, color }}>
            {score}
          </div>
          <div className="mono" style={{ fontSize: 10, color: COLORS.textDim, letterSpacing: '0.1em' }}>
            / 100
          </div>
          <div className="display" style={{ fontSize: 11, letterSpacing: '0.2em', color, marginTop: 6 }}>
            {label}
          </div>
        </div>
      </button>

      {/* Sub-stats */}
      <div style={{
        display: 'flex',
        alignItems: 'center',
        gap: 16,
        marginTop: 16,
      }}>
        <div style={{ textAlign: 'center' }}>
          <div className="mono" style={{ fontSize: 9, color: COLORS.textDim, letterSpacing: '0.15em' }}>UGE-SNIT</div>
          <div className="display" style={{ fontSize: 18, marginTop: 2 }}>{weekAvg}</div>
        </div>
        <div style={{ width: 1, height: 28, background: COLORS.border }} />
        <div style={{ textAlign: 'center', display: 'flex', alignItems: 'center', gap: 6 }}>
          <Flame size={16} color={streak > 0 ? COLORS.accent : COLORS.textMore} />
          <div>
            <div className="mono" style={{ fontSize: 9, color: COLORS.textDim, letterSpacing: '0.15em' }}>STREAK</div>
            <div className="display" style={{ fontSize: 18, marginTop: 2, color: streak > 0 ? COLORS.accent : COLORS.text }}>
              {streak} {streak === 1 ? 'DAG' : 'DAGE'}
            </div>
          </div>

function ScoreBreakdownModal({ score, onClose }) {
  const rows = [
    { label: 'SØVN', pts: score.sleep, max: 25, color: '#A78BFA',
      detail: score.sleepHours > 0 ? `${score.sleepHours.toFixed(1)}t · kvalitet ${score.sleepQuality}/10` : 'Ikke logget' },
    { label: 'PROTEIN', pts: score.protein, max: 25, color: COLORS.accent,
      detail: `${score.proteinGrams}g / ${GOALS.protein}g` },
    { label: 'TRÆNING', pts: score.training, max: 25, color: '#4ADE80',
      detail: score.trained ? 'Trænet ✓' : (score.training === 25 ? 'Hviledag ✓' : 'Ikke trænet') },
    { label: 'HYDRATION + TILSKUD', pts: score.hydration, max: 25, color: '#3B82F6',
      detail: `${(score.waterUnits * 0.25).toFixed(1)}L vand · ${score.suppCount} tilskud` },
  ];

  // Find biggest improvement opportunity
  const worst = [...rows].sort((a, b) => (a.pts / a.max) - (b.pts / b.max))[0];
  let tip = '';
  if (worst.label === 'PROTEIN') {
    const gap = GOALS.protein - score.proteinGrams;
    if (gap > 0) tip = `+${Math.round((gap / GOALS.protein) * 25)} point hvis du logger ${gap}g mere protein`;
  } else if (worst.label === 'SØVN') {
    tip = 'Bedre søvn er din største mulighed for at hæve scoren';
  } else if (worst.label === 'TRÆNING' && score.training < 25) {
    tip = '+25 point når du logger dagens træning';
  } else if (worst.label.includes('HYDRATION')) {
    tip = 'Drik mere vand og tag dine tilskud for fuld score her';
  }

  return (
    <div
      onClick={onClose}
      style={{
        position: 'fixed',
        inset: 0,
        background: 'rgba(0,0,0,0.8)',
        zIndex: 100,
        display: 'flex',
        alignItems: 'flex-end',
        justifyContent: 'center',
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: COLORS.bg,
          width: '100%',
          maxWidth: 480,
          borderTop: `1px solid ${COLORS.border}`,
          padding: '24px 24px calc(32px + env(safe-area-inset-bottom))',
          animation: 'slideUp 0.25s ease-out',
        }}
      >
        <style>{`@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }`}</style>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
          <div>
            <div className="mono" style={{ fontSize: 9, letterSpacing: '0.25em', color: COLORS.textDim, marginBottom: 4 }}>
              PEAK SCORE
            </div>
            <div className="display" style={{ fontSize: 40, lineHeight: 1, color: scoreColor(score.total) }}>
              {score.total}<span style={{ fontSize: 16, color: COLORS.textDim }}>/100</span>
            </div>
          </div>
          <button onClick={onClose} style={iconBtn}><X size={20} /></button>
        </div>

        {rows.map((r, i) => (
          <div key={i} style={{ marginBottom: 18 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
              <div className="display" style={{ fontSize: 13, letterSpacing: '0.1em' }}>{r.label}</div>
              <div className="mono" style={{ fontSize: 13 }}>
                <span style={{ color: r.color }}>{r.pts}</span>
                <span style={{ color: COLORS.textDim }}> / {r.max}</span>
              </div>
            </div>
            <div style={{ height: 8, background: COLORS.surfaceLight, borderRadius: 4, overflow: 'hidden', marginBottom: 4 }}>
              <div style={{ height: '100%', width: `${(r.pts / r.max) * 100}%`, background: r.color, transition: 'width 0.5s' }} />
            </div>
            <div className="mono" style={{ fontSize: 10, color: COLORS.textDim }}>{r.detail}</div>
          </div>
        ))}

        {tip && (
          <div style={{
            marginTop: 8,
            padding: '14px 16px',
            background: COLORS.accentDim,
            border: `1px solid ${COLORS.accent}`,
            display: 'flex',
            alignItems: 'center',
            gap: 10,
          }}>
            <Zap size={16} color={COLORS.accent} style={{ flexShrink: 0 }} />
            <div style={{ fontSize: 12, color: COLORS.text, lineHeight: 1.4 }}>{tip}</div>
          </div>
        )}
      </div>
    </div>
  );
}

function BackupSection() {
  const [showExport, setShowExport] = useState(false);
  const [exportData, setExportData] = useState('');
  const [importData, setImportData] = useState('');
  const [importMsg, setImportMsg] = useState('');

  const doExport = async () => {
    const allKeys = await safeList('');
    const data = {};
    for (const k of allKeys) {
      const v = await safeGet(k);
      if (v) data[k] = v;
    }
    setExportData(JSON.stringify(data, null, 2));
    setShowExport(true);
  };

  const copyExport = async () => {
    try {
      await navigator.clipboard.writeText(exportData);
      setImportMsg('Kopieret til clipboard ✓');
      setTimeout(() => setImportMsg(''), 2000);
    } catch (e) {
      setImportMsg('Kunne ikke kopiere – marker tekst manuelt');
    }
  };

  const doImport = async () => {
    try {
      const data = JSON.parse(importData);
      let count = 0;
      for (const [k, v] of Object.entries(data)) {
        await safeSet(k, v);
        count++;
      }
      setImportMsg(`✓ Importerede ${count} entries. Genindlæs siden for at se data.`);
    } catch (e) {
      setImportMsg('Fejl: ugyldig JSON');
    }
  };

  return (
    <Section title="BACKUP">
      <div style={{ fontSize: 12, color: COLORS.textDim, marginBottom: 12, lineHeight: 1.5 }}>
        Hvis persistent storage ikke virker, kan du kopiere dine data ud og indsætte det igen senere.
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12 }}>
        <button
          onClick={doExport}
          className="display"
          style={{
            background: COLORS.surfaceLight,
            border: `1px solid ${COLORS.border}`,
            color: COLORS.text,
            padding: '12px',
            fontSize: 12,
            letterSpacing: '0.1em',
            cursor: 'pointer',
          }}
        >EXPORT</button>
        <button
          onClick={() => { setShowExport('import'); setExportData(''); }}
          className="display"
          style={{
            background: COLORS.surfaceLight,
            border: `1px solid ${COLORS.border}`,
            color: COLORS.text,
            padding: '12px',
            fontSize: 12,
            letterSpacing: '0.1em',
            cursor: 'pointer',
          }}
        >IMPORT</button>
      </div>
      {showExport === true && exportData && (
        <>
          <textarea
            value={exportData}
            readOnly
            style={{
              width: '100%',
              background: COLORS.surfaceLight,
              border: `1px solid ${COLORS.border}`,
              color: COLORS.text,
              padding: 10,
              fontFamily: 'JetBrains Mono, monospace',
              fontSize: 16,
              minHeight: 120,
              borderRadius: 2,
            }}
          />
          <button
            onClick={copyExport}
            style={{
              width: '100%',
              marginTop: 8,
              background: COLORS.accent,
              color: '#000',
              border: 'none',
              padding: '10px',
              fontSize: 12,
              letterSpacing: '0.1em',
              cursor: 'pointer',
              fontFamily: 'Anton, sans-serif',
            }}
          >KOPIÉR</button>
        </>
      )}
      {showExport === 'import' && (
        <>
          <textarea
            value={importData}
            onChange={(e) => setImportData(e.target.value)}
            placeholder="Indsæt JSON her..."
            style={{
              width: '100%',
              background: COLORS.surfaceLight,
              border: `1px solid ${COLORS.border}`,
              color: COLORS.text,
              padding: 10,
              fontFamily: 'JetBrains Mono, monospace',
              fontSize: 16,
              minHeight: 120,
              borderRadius: 2,
            }}
          />
          <button
            onClick={doImport}
            style={{
              width: '100%',
              marginTop: 8,
              background: COLORS.accent,
              color: '#000',
              border: 'none',
              padding: '10px',
              fontSize: 12,
              letterSpacing: '0.1em',
              cursor: 'pointer',
              fontFamily: 'Anton, sans-serif',
            }}
          >INDLÆS</button>
        </>
      )}
      {importMsg && (
        <div style={{ fontSize: 11, color: COLORS.green, marginTop: 8, textAlign: 'center' }}>

// ACTIVE WORKOUT SESSION
// ════════════════════════════════════════════════════════════════
function ActiveSession({ session, setSession, entry, update, history, onEnd, onHome }) {
  const prog = PROGRAM[session.workoutType];
  const exercises = prog?.exercises || [];
  const currentExercise = exercises.find(e => e.id === session.currentExerciseId) || exercises[0];
  const currentExIndex = exercises.findIndex(e => e.id === session.currentExerciseId);
  const totalExercises = exercises.length;

  const [confirmEnd, setConfirmEnd] = useState(false);

  // Live clock
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  // Vibration helper (may not work on iOS Safari, fallback to visual flash)
  const [flashRest, setFlashRest] = useState(false);
  const buzz = () => {
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
    setFlashRest(true);
    setTimeout(() => setFlashRest(false), 1500);
  };

  // Calculate session metrics
  const elapsed = now - session.startTime;
  const completedSets = session.completedSets || [];
  const totalVolume = completedSets.reduce((s, x) => s + (x.kg || 0) * (x.reps || 0), 0);

  // Auto-detect rest finish
  useEffect(() => {
    if (session.phase === 'resting' && session.restEndTime && now >= session.restEndTime) {
      buzz();
      setSession({ ...session, phase: 'logging', restEndTime: null });
    }
  }, [now, session.phase, session.restEndTime]);

  // Get suggestion from history or last set in current session
  const exHistory = history[session.currentExerciseId] || [];
  const completedThisSession = completedSets.filter(s => s.exId === session.currentExerciseId);
  const lastSet = completedThisSession.length > 0
    ? completedThisSession[completedThisSession.length - 1]
    : (exHistory[0] ? { kg: exHistory[0].kg, reps: exHistory[0].reps, rpe: null } : null);
  const suggestion = suggestNextWeight(lastSet, currentExercise?.target || 8);

  // Log set
  const logSet = (kg, reps) => {
    setSession({ ...session, phase: 'rpe', pendingSet: { kg, reps } });
  };

  const setRPE = (rpe) => {
    const setData = {
      exId: session.currentExerciseId,
      kg: session.pendingSet.kg,
      reps: session.pendingSet.reps,
      rpe,
      completedAt: Date.now(),
    };
    const newCompletedSets = [...completedSets, setData];

    // Update entry.workout.exercises live
    const exId = session.currentExerciseId;
    const currentSets = entry.workout?.exercises?.[exId] || [];
    const newSets = [...currentSets];
    newSets[session.currentSetIndex] = { kg: String(setData.kg), reps: String(setData.reps), rpe };
    const newExercises = { ...(entry.workout?.exercises || {}), [exId]: newSets };
    update('workout.exercises', newExercises);

    // Determine next state
    const setsForThisEx = currentExercise.sets;
    const nextSetIndex = session.currentSetIndex + 1;
    const isLastSetOfExercise = nextSetIndex >= setsForThisEx;
    const isLastExercise = currentExIndex >= exercises.length - 1;

    if (isLastSetOfExercise && isLastExercise) {
      // Workout complete
      setSession({
        ...session,
        phase: 'done',
        completedSets: newCompletedSets,
        pendingSet: null,
      });
    } else if (isLastSetOfExercise) {
      // Next exercise, no rest between (user can rest before starting)
      const nextExercise = exercises[currentExIndex + 1];
      const restDuration = currentExercise.compound ? REST_COMPOUND : REST_ISOLATION;
      setSession({
        ...session,
        phase: 'resting',
        currentExerciseId: nextExercise.id,
        currentSetIndex: 0,
        pendingSet: null,
        restEndTime: Date.now() + restDuration * 1000,
        restPlannedDuration: restDuration,
        completedSets: newCompletedSets,
      });
    } else {
      // Next set, with rest
      const restDuration = currentExercise.compound ? REST_COMPOUND : REST_ISOLATION;
      setSession({
        ...session,
        phase: 'resting',
        currentSetIndex: nextSetIndex,
        pendingSet: null,
        restEndTime: Date.now() + restDuration * 1000,
        restPlannedDuration: restDuration,
        completedSets: newCompletedSets,
      });
    }
  };

  const skipRest = () => setSession({ ...session, phase: 'logging', restEndTime: null });
  const adjustRest = (delta) => {
    if (!session.restEndTime) return;
    setSession({ ...session, restEndTime: session.restEndTime + delta * 1000 });
  };

  const skipExercise = () => {
    if (currentExIndex < exercises.length - 1) {
      setSession({
        ...session,
        currentExerciseId: exercises[currentExIndex + 1].id,
        currentSetIndex: 0,
        phase: 'logging',
        restEndTime: null,
      });
    }
  };

  if (session.phase === 'done') {
    return <SessionSummary session={session} totalVolume={totalVolume} elapsed={elapsed} onEnd={onEnd} />;
  }

  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex',
      flexDirection: 'column',
      background: flashRest ? COLORS.accent : COLORS.bg,
      transition: 'background 0.3s',
    }}>
      {/* Top header */}
      <div style={{
        padding: '16px 20px 12px',
        borderBottom: `1px solid ${COLORS.border}`,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
      }}>
        <button
          onClick={() => setConfirmEnd(true)}
          style={{ ...iconBtn, color: COLORS.red, gap: 4 }}
        >
          <X size={18} />
          <span className="display" style={{ fontSize: 10, letterSpacing: '0.15em' }}>AFSLUT</span>
        </button>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div className="pulse" style={{ width: 6, height: 6, background: COLORS.red, borderRadius: '50%' }} />
          <div className="mono" style={{ fontSize: 11, letterSpacing: '0.15em' }}>
            {formatTime(elapsed / 1000)}
          </div>
        </div>
        <button onClick={skipExercise} style={{ ...iconBtn, gap: 4 }}>
          <SkipForward size={16} />
          <span className="display" style={{ fontSize: 10, letterSpacing: '0.15em' }}>SKIP</span>
        </button>
      </div>

      {/* Progress dots */}
      <div style={{
        padding: '14px 20px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        borderBottom: `1px solid ${COLORS.border}`,
      }}>
        <div className="mono" style={{ fontSize: 10, color: COLORS.textDim, letterSpacing: '0.2em' }}>
          ØVELSE {currentExIndex + 1} / {totalExercises}
        </div>
        <div style={{ display: 'flex', gap: 4 }}>
          {exercises.map((_, i) => (
            <div key={i} style={{
              width: i === currentExIndex ? 16 : 6,
              height: 4,
              background: i < currentExIndex ? COLORS.accent : (i === currentExIndex ? COLORS.accent : COLORS.surfaceLight),
              transition: 'width 0.3s',
            }} />
          ))}
        </div>
      </div>

      {/* MAIN CONTENT */}
      <div style={{ flex: 1, padding: '24px 20px', display: 'flex', flexDirection: 'column' }}>
        {session.phase === 'resting' && (
          <RestView
            session={session}
            now={now}
            currentExercise={currentExercise}
            suggestion={suggestion}
            onSkip={skipRest}
            onAdjust={adjustRest}
          />
        )}

        {session.phase === 'logging' && (
          <LoggingView
            currentExercise={currentExercise}
            setIndex={session.currentSetIndex}
            suggestion={suggestion}
            exHistory={exHistory}
            onLog={logSet}
          />
        )}

        {session.phase === 'rpe' && (
          <RPEView pendingSet={session.pendingSet} onSelect={setRPE} />
        )}
      </div>

      {/* Live metrics bar */}
      <div style={{
        padding: 'calc(14px + env(safe-area-inset-bottom)) 20px 14px',
        borderTop: `1px solid ${COLORS.border}`,
        background: COLORS.surface,
        display: 'flex',
        justifyContent: 'space-around',
        alignItems: 'center',
      }}>
        <MetricItem label="VOLUMEN" value={Math.round(totalVolume).toLocaleString()} unit="kg" />
        <div style={{ width: 1, height: 32, background: COLORS.border }} />
        <MetricItem label="SÆT" value={completedSets.length} />
        <div style={{ width: 1, height: 32, background: COLORS.border }} />
        <MetricItem label="TID" value={formatTime(elapsed / 1000)} />
      </div>

      {confirmEnd && (
        <ConfirmEndModal
          completedSets={completedSets.length}
          onCancel={() => setConfirmEnd(false)}
          onConfirm={() => {
            setConfirmEnd(false);
            // Mark phase done so we go through proper summary flow
            setSession({ ...session, phase: 'done' });
          }}
        />
      )}
    </div>
  );
}

function formatTime(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const mins = Math.floor(s / 60);
  const secs = s % 60;
  return `${mins}:${String(secs).padStart(2, '0')}`;
}

        gap: 10,

        <div style={{ flex: 1 }}>
          <div className="mono" style={{ fontSize: 9, color: COLORS.accent, letterSpacing: '0.2em' }}>FORSLAG</div>
          <div style={{ fontSize: 13, color: COLORS.text, marginTop: 2 }}>
            {suggestion.weight}kg × {suggestion.reps} <span style={{ color: COLORS.textDim, fontSize: 11 }}>· {suggestion.reason}</span>

function RestView({ session, now, currentExercise, suggestion, onSkip, onAdjust }) {
  const remaining = Math.max(0, (session.restEndTime - now) / 1000);
  const total = session.restPlannedDuration || (currentExercise.compound ? REST_COMPOUND : REST_ISOLATION);
  const progress = 1 - (remaining / total);
  const size = 220;
  const stroke = 8;
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
      <div className="mono" style={{ fontSize: 10, color: COLORS.accent, letterSpacing: '0.3em', marginBottom: 24 }}>
        HVILE
      </div>

      {/* Circular progress */}
      <div style={{ position: 'relative', width: size, height: size, marginBottom: 24 }}>
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
          <circle cx={size/2} cy={size/2} r={radius} stroke={COLORS.surfaceLight} strokeWidth={stroke} fill="none" />
          <circle
            cx={size/2}
            cy={size/2}
            r={radius}
            stroke={COLORS.accent}
            strokeWidth={stroke}
            fill="none"
            strokeDasharray={circumference}
            strokeDashoffset={circumference * (1 - progress)}
            strokeLinecap="round"
            style={{ transition: 'stroke-dashoffset 0.5s linear' }}
          />
        </svg>
        <div style={{
          position: 'absolute',
          inset: 0,
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
        }}>
          <div className="display" style={{ fontSize: 56, lineHeight: 1 }}>
            {formatTime(remaining)}
          </div>
          <div className="mono" style={{ fontSize: 10, color: COLORS.textDim, letterSpacing: '0.2em', marginTop: 6 }}>
            af {formatTime(total)}
          </div>
        </div>
      </div>

      {/* Next up */}
      <div style={{
        padding: '12px 18px',
        border: `1px solid ${COLORS.border}`,
        background: COLORS.surface,
        marginBottom: 24,
      }}>
        <div className="mono" style={{ fontSize: 9, color: COLORS.textDim, letterSpacing: '0.25em', marginBottom: 4, textAlign: 'center' }}>
          NÆSTE
        </div>
        <div className="display" style={{ fontSize: 16, textAlign: 'center', letterSpacing: '0.05em' }}>
          {currentExercise.name}
        </div>
        <div style={{ fontSize: 12, color: COLORS.accent, marginTop: 4, textAlign: 'center' }}>
          Sæt {session.currentSetIndex + 1} · {suggestion.weight}kg × {suggestion.reps}
        </div>
      </div>

      {/* Controls */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, width: '100%' }}>
        <button
          onClick={() => onAdjust(-30)}
          className="mono"
          style={{
            background: COLORS.surfaceLight,
            border: `1px solid ${COLORS.border}`,
            color: COLORS.text,
            padding: '12px 0',
            fontSize: 13,
            cursor: 'pointer',
            borderRadius: 2,
          }}
        >−30s</button>
        <button
          onClick={onSkip}
          className="display"
          style={{
            background: COLORS.accent,
            color: '#000',
            border: 'none',
            padding: '12px 0',
            fontSize: 12,
            letterSpacing: '0.15em',
            cursor: 'pointer',
            borderRadius: 2,
          }}
        >SKIP HVILE</button>
        <button
          onClick={() => onAdjust(30)}
          className="mono"
          style={{
            background: COLORS.surfaceLight,
            border: `1px solid ${COLORS.border}`,
            color: COLORS.text,
            padding: '12px 0',
            fontSize: 13,
            cursor: 'pointer',
            borderRadius: 2,
          }}
        >+30s</button>
      </div>
    </div>
  );
}

function SessionSummary({ session, totalVolume, elapsed, onEnd }) {
  const completedSets = session.completedSets || [];
  const exercisesDone = new Set(completedSets.map(s => s.exId)).size;

  // Find PRs in this session
  const prs = [];
  const exerciseMaxes = {};
  completedSets.forEach(s => {
    if (!exerciseMaxes[s.exId] || s.kg > exerciseMaxes[s.exId].kg) {
      exerciseMaxes[s.exId] = s;
    }
  });

  const avgRPE = completedSets.length > 0
    ? (completedSets.reduce((sum, s) => sum + (s.rpe || 0), 0) / completedSets.length).toFixed(1)
    : '—';

  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex',
      flexDirection: 'column',
      padding: '40px 24px',
      paddingBottom: 'calc(40px + env(safe-area-inset-bottom))',
    }}>
      <div style={{ textAlign: 'center', marginBottom: 32 }}>
        <Award size={48} color={COLORS.accent} style={{ margin: '0 auto 16px' }} />
        <div className="mono" style={{ fontSize: 10, letterSpacing: '0.3em', color: COLORS.accent, marginBottom: 8 }}>
          SESSION FÆRDIG
        </div>
        <div className="display" style={{ fontSize: 32, letterSpacing: '0.05em', lineHeight: 1 }}>
          GOD INDSATS
        </div>
      </div>

      <div style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(2, 1fr)',
        gap: 1,
        background: COLORS.border,
        border: `1px solid ${COLORS.border}`,
        marginBottom: 24,
      }}>
        <StatCell label="VOLUMEN" value={Math.round(totalVolume).toLocaleString()} unit="kg" accent />
        <StatCell label="TID" value={formatTime(elapsed / 1000)} />
        <StatCell label="SÆT" value={completedSets.length} />
        <StatCell label="ØVELSER" value={exercisesDone} />
        <StatCell label="GNS. RPE" value={avgRPE} />
        <StatCell label="WORKOUT" value={PROGRAM[session.workoutType]?.name || '—'} />
      </div>

      <div className="display" style={{ fontSize: 12, letterSpacing: '0.2em', color: COLORS.textDim, marginBottom: 12 }}>
        TOP LØFT
      </div>
      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, marginBottom: 32 }}>
        {Object.entries(exerciseMaxes).map(([exId, s]) => {
          const ex = Object.values(PROGRAM)
            .flatMap(p => p.exercises)
            .find(e => e.id === exId);
          return (
            <div key={exId} style={{
              padding: '12px 16px',
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              borderBottom: `1px solid ${COLORS.border}`,
            }}>
              <div style={{ fontSize: 13 }}>{ex?.name || exId}</div>
              <div className="mono" style={{ fontSize: 13, color: COLORS.accent }}>
                {s.kg}kg × {s.reps} <span style={{ color: COLORS.textDim, fontSize: 10 }}>@ RPE {s.rpe}</span>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ flex: 1 }} />

      <button
        onClick={onEnd}
        className="display"
        style={{
          background: COLORS.accent,
          color: '#000',
          border: 'none',
          padding: '20px',
          fontSize: 16,
          letterSpacing: '0.15em',
          cursor: 'pointer',
        }}
      >GEM &amp; AFSLUT</button>
    </div>
  );
}

function FoodPickerModal({ onClose, onAdd, catalog }) {
  const [search, setSearch] = useState('');
  const [pendingFood, setPendingFood] = useState(null);
  const [qty, setQty] = useState(1);
  const [showCustom, setShowCustom] = useState(false);
  const [customFood, setCustomFood] = useState({ name: '', unit: '100g', p: 0, c: 0, f: 0, emoji: '🍽️' });

  // Build combined food list: catalog (custom + previously used) first, then common
  const catalogIds = new Set(catalog.map(c => c.name));
  const commonNotInCatalog = COMMON_FOODS.filter(f => !catalogIds.has(f.name));
  const allFoods = [...catalog, ...commonNotInCatalog];

  // Recent: sorted by lastUsed
  const recent = [...catalog]
    .sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0))
    .slice(0, 8);

  // Filtered list
  const q = search.trim().toLowerCase();
  const filtered = q
    ? allFoods.filter(f => f.name.toLowerCase().includes(q))
    : allFoods;

  // Group by category for cleaner display when not searching
  const byCategory = {
    protein: filtered.filter(f => f.cat === 'protein'),
    carbs: filtered.filter(f => f.cat === 'carbs'),
    fat: filtered.filter(f => f.cat === 'fat'),
    other: filtered.filter(f => !f.cat || f.cat === 'other' || f.cat === 'custom'),
  };

  const CAT_LABELS = { protein: 'PROTEIN', carbs: 'KULHYDRATER', fat: 'FEDT', other: 'ANDET' };

  return (
    <div
      onClick={onClose}
      style={{
        position: 'fixed',
        inset: 0,
        background: 'rgba(0,0,0,0.7)',
        zIndex: 100,
        display: 'flex',
        alignItems: 'flex-end',
        justifyContent: 'center',
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: COLORS.bg,
          width: '100%',
          maxWidth: 480,
          maxHeight: '90vh',
          borderTop: `1px solid ${COLORS.border}`,
          display: 'flex',
          flexDirection: 'column',
          animation: 'slideUp 0.2s ease-out',
        }}
      >
        <style>{`@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }`}</style>

        {pendingFood ? (
          /* Quantity selector */
          <div style={{ padding: 24 }}>
            <button onClick={() => setPendingFood(null)} style={{ ...iconBtn, marginBottom: 16, paddingLeft: 0 }}>
              <ChevronLeft size={20} /> <span style={{ fontSize: 13, marginLeft: 4 }}>Tilbage</span>
            </button>
            <div style={{ textAlign: 'center', padding: '20px 0' }}>
              <div style={{ fontSize: 48, marginBottom: 8 }}>{pendingFood.emoji}</div>
              <div className="display" style={{ fontSize: 22, marginBottom: 4 }}>{pendingFood.name}</div>
              <div className="mono" style={{ fontSize: 12, color: COLORS.textDim }}>
                Pr. {pendingFood.unit}: {pendingFood.p}P · {pendingFood.c}C · {pendingFood.f}F
              </div>
            </div>
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 11, color: COLORS.textDim, marginBottom: 8, letterSpacing: '0.08em' }}>ANTAL ({pendingFood.unit})</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <button onClick={() => setQty(Math.max(0.5, +(qty - 0.5).toFixed(1)))} style={circleBtn}><Minus size={18} /></button>
                <input
                  type="number"
                  inputMode="decimal"
                  className="mono"
                  value={qty}
                  onChange={e => setQty(parseFloat(e.target.value) || 0)}
                  style={{
                    flex: 1,
                    background: COLORS.surfaceLight,
                    border: `1px solid ${COLORS.accent}`,
                    color: COLORS.text,
                    padding: '16px 8px',
                    fontSize: 28,
                    textAlign: 'center',
                    borderRadius: 2,
                  }}
                />
                <button onClick={() => setQty(+(qty + 0.5).toFixed(1))} style={circleBtn}><Plus size={18} /></button>
              </div>
              <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
                {[1, 2, 3, 4, 5].map(n => (
                  <button
                    key={n}
                    onClick={() => setQty(n)}
                    className="mono"
                    style={{
                      flex: 1,
                      background: qty === n ? COLORS.accent : COLORS.surfaceLight,
                      color: qty === n ? '#000' : COLORS.text,
                      border: `1px solid ${qty === n ? COLORS.accent : COLORS.border}`,
                      padding: '8px 0',
                      fontSize: 14,
                      cursor: 'pointer',
                      borderRadius: 2,
                    }}
                  >{n}</button>
                ))}
              </div>
            </div>
            <div style={{ background: COLORS.surface, padding: 16, marginBottom: 16, border: `1px solid ${COLORS.border}` }}>
              <div style={{ fontSize: 11, color: COLORS.textDim, marginBottom: 8, letterSpacing: '0.08em' }}>TOTAL</div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <div>
                  <div className="mono" style={{ fontSize: 24, color: COLORS.accent }}>
                    {Math.round(pendingFood.p * qty)}<span style={{ fontSize: 12, color: COLORS.textDim }}>g protein</span>
                  </div>
                </div>
                <div className="mono" style={{ fontSize: 13, color: COLORS.textDim }}>
                  {Math.round(pendingFood.c * qty)}C · {Math.round(pendingFood.f * qty)}F
                </div>
              </div>
              <div className="mono" style={{ fontSize: 11, color: COLORS.textMore, marginTop: 4 }}>
                {Math.round(pendingFood.p * qty * 4 + pendingFood.c * qty * 4 + pendingFood.f * qty * 9)} kcal
              </div>
            </div>
            <button
              onClick={() => qty > 0 && onAdd(pendingFood, qty)}
              className="display"
              style={{
                width: '100%',
                background: COLORS.accent,
                color: '#000',
                border: 'none',
                padding: '16px',
                fontSize: 16,
                letterSpacing: '0.15em',
                cursor: 'pointer',
              }}
            >TILFØJ TIL DAG</button>
          </div>
        ) : showCustom ? (
          /* Custom food form */
          <div style={{ padding: 24 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
              <button onClick={() => setShowCustom(false)} style={iconBtn}>
                <ChevronLeft size={20} /> <span style={{ fontSize: 13, marginLeft: 4 }}>Tilbage</span>
              </button>
              <div className="display" style={{ fontSize: 16, letterSpacing: '0.1em' }}>EGEN MAD</div>
              <div style={{ width: 40 }} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: COLORS.textDim, marginBottom: 6, letterSpacing: '0.08em' }}>NAVN</div>
              <input
                type="text"
                value={customFood.name}
                onChange={e => setCustomFood({ ...customFood, name: e.target.value })}
                placeholder="fx Mors lasagne"
                style={{
                  width: '100%',
                  background: COLORS.surfaceLight,
                  border: `1px solid ${COLORS.border}`,
                  color: COLORS.text,
                  padding: '12px',
                  fontSize: 16,
                  borderRadius: 2,
                }}
              />
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: COLORS.textDim, marginBottom: 6, letterSpacing: '0.08em' }}>ENHED</div>
              <input
                type="text"
                value={customFood.unit}
                onChange={e => setCustomFood({ ...customFood, unit: e.target.value })}
                placeholder="fx 100g, stk, portion"
                style={{
                  width: '100%',
                  background: COLORS.surfaceLight,
                  border: `1px solid ${COLORS.border}`,
                  color: COLORS.text,
                  padding: '12px',
                  fontSize: 16,
                  borderRadius: 2,
                }}
              />
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 20 }}>
              {['p', 'c', 'f'].map(k => (
                <div key={k}>
                  <div style={{ fontSize: 11, color: COLORS.textDim, marginBottom: 6, letterSpacing: '0.08em' }}>
                    {{ p: 'PROTEIN', c: 'CARBS', f: 'FEDT' }[k]}
                  </div>
                  <input
                    type="number"
                    inputMode="decimal"
                    value={customFood[k] || ''}
                    onChange={e => setCustomFood({ ...customFood, [k]: parseFloat(e.target.value) || 0 })}
                    placeholder="0"
                    className="mono"
                    style={{
                      width: '100%',
                      background: COLORS.surfaceLight,
                      border: `1px solid ${COLORS.border}`,
                      color: COLORS.text,
                      padding: '10px 4px',
                      fontSize: 16,
                      textAlign: 'center',
                      borderRadius: 2,
                    }}
                  />
                </div>
              ))}
            </div>
            <button
              onClick={() => {
                if (!customFood.name) return;
                setPendingFood({ ...customFood, id: null });
                setShowCustom(false);
              }}
              className="display"
              style={{
                width: '100%',
                background: customFood.name ? COLORS.accent : COLORS.surfaceLight,
                color: customFood.name ? '#000' : COLORS.textDim,
                border: 'none',
                padding: '14px',
                fontSize: 14,
                letterSpacing: '0.15em',
                cursor: customFood.name ? 'pointer' : 'not-allowed',
              }}
            >FORTSÆT</button>
          </div>
        ) : (
          /* Food browser */
          <>
            <div style={{ padding: '16px 20px 12px', borderBottom: `1px solid ${COLORS.border}` }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                <div className="display" style={{ fontSize: 18, letterSpacing: '0.1em' }}>TILFØJ MAD</div>
                <button onClick={onClose} style={iconBtn}><X size={20} /></button>
              </div>
              <div style={{ position: 'relative' }}>
                <Search size={16} style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: COLORS.textDim }} />
                <input
                  type="text"
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  placeholder="Søg mad..."
                  autoFocus
                  style={{
                    width: '100%',
                    background: COLORS.surfaceLight,
                    border: `1px solid ${COLORS.border}`,
                    color: COLORS.text,
                    padding: '10px 12px 10px 36px',
                    fontSize: 16,
                    borderRadius: 2,
                  }}
                />
              </div>
            </div>

            <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px' }}>
              {/* Recent (only when not searching) */}
              {!q && recent.length > 0 && (
                <div style={{ marginBottom: 20 }}>
                  <div className="display" style={{ fontSize: 11, letterSpacing: '0.15em', color: COLORS.accent, marginBottom: 10 }}>
                    SENEST BRUGT
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                    {recent.map(f => (
                      <button
                        key={f.id}
                        onClick={() => { setPendingFood(f); setQty(1); }}
                        style={{
                          background: COLORS.accentDim,
                          color: COLORS.accent,
                          border: `1px solid ${COLORS.accent}`,
                          padding: '8px 12px',
                          fontSize: 13,
                          cursor: 'pointer',
                          borderRadius: 2,
                          display: 'flex',
                          alignItems: 'center',
                          gap: 6,
                        }}
                      >
                        <span>{f.emoji || '🍽️'}</span>
                        <span>{f.name}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Foods by category */}
              {Object.entries(byCategory).map(([cat, items]) => (
                items.length > 0 && (
                  <div key={cat} style={{ marginBottom: 20 }}>
                    <div className="display" style={{ fontSize: 11, letterSpacing: '0.15em', color: COLORS.textDim, marginBottom: 8 }}>
                      {CAT_LABELS[cat]}
                    </div>
                    {items.map(f => (
                      <button
                        key={f.id || f.name}
                        onClick={() => { setPendingFood(f); setQty(1); }}
                        style={{
                          width: '100%',
                          background: 'transparent',
                          border: 'none',
                          borderBottom: `1px solid ${COLORS.border}`,
                          padding: '12px 0',
                          display: 'flex',
                          alignItems: 'center',
                          gap: 12,
                          cursor: 'pointer',
                          color: COLORS.text,
                          textAlign: 'left',
                        }}
                      >
                        <span style={{ fontSize: 22 }}>{f.emoji || '🍽️'}</span>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 14 }}>{f.name}</div>
                          <div className="mono" style={{ fontSize: 10, color: COLORS.textDim, marginTop: 2 }}>
                            pr. {f.unit}: {f.p}P · {f.c}C · {f.f}F
                          </div>
                        </div>
                        {f.useCount > 1 && (
                          <span className="mono" style={{ fontSize: 10, color: COLORS.textMore }}>
                            {f.useCount}×
                          </span>
                        )}
                        <Plus size={16} color={COLORS.textDim} />
                      </button>
                    ))}
                  </div>
                )
              ))}

              {/* No results */}
              {filtered.length === 0 && q && (
                <div style={{ textAlign: 'center', padding: 30, color: COLORS.textDim, fontSize: 13 }}>
                  Ingen mad fundet for "{search}"
                </div>
              )}

              {/* Custom food button */}
              <button
                onClick={() => {
                  setShowCustom(true);
                  if (q) setCustomFood({ ...customFood, name: search });
                }}
                style={{
                  width: '100%',
                  background: COLORS.surface,
                  border: `1px dashed ${COLORS.border}`,
                  color: COLORS.textDim,
                  padding: '14px',
                  fontSize: 13,
                  cursor: 'pointer',
                  marginTop: 8,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  gap: 8,
                }}
              >
                <Plus size={14} /> Tilføj egen mad
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


const boot = document.getElementById('boot');
if (boot) boot.remove();
createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
